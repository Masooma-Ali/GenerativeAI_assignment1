server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # uploads up to 10 MB are accepted by the backend
    client_max_body_size 12m;

    # same-origin API: the browser calls /api/..., nginx forwards to the backend service
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /docs { proxy_pass http://backend:8000; }
    location /openapi.json { proxy_pass http://backend:8000; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
